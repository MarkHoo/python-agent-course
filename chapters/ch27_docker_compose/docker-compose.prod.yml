# 生产编排：中间件不对外暴露端口，业务服务由 Dockerfile 构建
# 用法：docker compose -f docker-compose.prod.yml up -d --build
services:
  mysql-prod:
    image: mysql:8.4
    container_name: mysql-prod
    environment:
      # 全部走 ${VAR} 引用，密钥只存在于 .env.prod（不进镜像、不进 git）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-book}
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mysql-prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      options:
        max-size: "20m"
        max-file: "5"
    # 生产环境不映射端口：只有同一 compose 网络内的服务能访问

  agent-app:
    container_name: agent-app
    build:
      context: ../..            # 以仓库根目录为上下文（要用到 pyproject.toml 与 src/）
      dockerfile: chapters/ch27_docker_compose/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.prod               # 环境变量分层：prod 用 prod 的那一层
    environment:
      APP_ENV: prod
      # 容器内用**服务名**访问中间件，而不是 localhost
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql-prod:3306/${MYSQL_DATABASE:-book}
    depends_on:
      mysql-prod:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    name: agent-prod-network
